x-production-app: &production-app
  build: .
  environment:
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the production env file}
    ORIGIN: https://${DOMAIN:?Set DOMAIN in the production env file}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DEPLOYMENT_VERSION: ${DEPLOYMENT_VERSION:-dev}
  depends_on:
    db:
      condition: service_healthy
  networks:
    edge:
    database:
    monitoring:
      aliases: [app]
  healthcheck:
    test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health >/dev/null']
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 60s
  restart: unless-stopped

services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the production env file}

  app:
    profiles: ['development']
    ports: !reset []
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the production env file}
      ORIGIN: https://${DOMAIN:?Set DOMAIN in the production env file}

  app-blue:
    <<: *production-app
    profiles: ['blue']

  app-green:
    <<: *production-app
    profiles: ['green']

  backup:
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the production env file}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?Set RESTIC_REPOSITORY in the production env file}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Set RESTIC_PASSWORD in the production env file}

  prometheus:
    ports: !reset []
    depends_on: !override []

  alloy:
    ports: !reset []

  grafana:
    ports: !override
      - '127.0.0.1:3001:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in the production env file}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in the production env file}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'

  proxy:
    image: caddy:2.10.2-alpine
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in the production env file}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in the production env file}
    volumes:
      - ./monitoring/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.deploy:/etc/caddy/deploy:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
