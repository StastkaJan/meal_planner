x-production-app: &production-app
  build: .
  environment:
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the production env file}
    ORIGIN: https://${DOMAIN:?Set DOMAIN in the production env file}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DEPLOYMENT_VERSION: ${DEPLOYMENT_VERSION:-dev}
  depends_on:
    db:
      condition: service_healthy
  networks:
    edge:
    database:
    monitoring:
      aliases: [app]
  healthcheck:
    test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health >/dev/null']
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 60s
  restart: unless-stopped

services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the production env file}
    ports:
      - '${GRAFANA_BIND_ADDRESS:-127.0.0.1}:5432:5432'

  app:
    profiles: ['development']
    ports: !reset []
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the production env file}
      ORIGIN: https://${DOMAIN:?Set DOMAIN in the production env file}

  app-blue:
    <<: *production-app
    profiles: ['blue']

  app-green:
    <<: *production-app
    profiles: ['green']

  backup:
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the production env file}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?Set RESTIC_REPOSITORY in the production env file}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Set RESTIC_PASSWORD in the production env file}

  prometheus:
    ports: !reset []
    depends_on: !override
      alertmanager:
        condition: service_started
      blackbox-exporter:
        condition: service_started
      node-exporter:
        condition: service_started
      postgres-exporter:
        condition: service_started
      cadvisor:
        condition: service_started

  postgres-exporter:
    environment:
      DATA_SOURCE_NAME: ${DATABASE_URL:?Set DATABASE_URL in the production env file}

  alloy:
    ports: !reset []

  grafana:
    ports: !override
      - '${GRAFANA_BIND_ADDRESS:-127.0.0.1}:3001:3000'
    networks:
      - monitoring
      - admin
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in the production env file}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in the production env file}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'

  proxy:
    image: caddy:2.10.2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in the production env file}
    volumes:
      - ./monitoring/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.deploy:/etc/caddy/deploy:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
      public-web:
        aliases: [meal-plan-proxy]
    restart: unless-stopped

networks:
  public-web:
    name: public-web
    external: true
  admin:

volumes:
  caddy-data:
  caddy-config:

secrets:
  alert_webhook_url: !override
    environment: ALERT_WEBHOOK_URL
