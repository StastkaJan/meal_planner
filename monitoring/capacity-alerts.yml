groups:
  - name: capacity
    rules:
      - alert: CapacityExporterDown
        expr: up{job=~"postgres|containers"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.job }} capacity metrics are unavailable'
          runbook: docs/capacity.md#missing-capacity-metrics

      - alert: DatabaseConnectionsHigh
        expr: sum(pg_stat_database_numbackends) / scalar(max(pg_settings_max_connections)) > 0.8
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL is using more than 80% of available connections
          runbook: docs/capacity.md#database-connections

      - alert: DatabaseSizeHigh
        expr: pg_database_size_bytes{datname="mealplan"} > 10 * 1024 * 1024 * 1024
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Meal Plan database is larger than 10 GiB
          runbook: docs/capacity.md#database-size

      - alert: ApplicationMemoryHigh
        expr: max(container_memory_working_set_bytes{service="app"}) > 512 * 1024 * 1024
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Application working-set memory is above 512 MiB
          runbook: docs/capacity.md#memory

      - alert: DatabaseMemoryHigh
        expr: max(container_memory_working_set_bytes{service="db"}) > 1024 * 1024 * 1024
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL working-set memory is above 1 GiB
          runbook: docs/capacity.md#memory

      - alert: DatabaseDiskSpaceLow
        expr: 1 - max by (device) (container_fs_usage_bytes{service="db"}) / max by (device) (container_fs_limit_bytes{service="db"}) < 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL filesystem has less than 15% free space
          runbook: docs/capacity.md#disk

      - alert: SlowServiceOperations
        expr: (sum by (service, operation) (increase(slow_service_operations_total[10m])) / sum by (service, operation) (increase(service_operations_total[10m])) > 0.05) and sum by (service, operation) (increase(service_operations_total[10m])) >= 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.service }}.{{ $labels.operation }} has more than 5% slow operations'
          runbook: docs/capacity.md#slow-operations
