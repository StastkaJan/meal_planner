global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/capacity-alerts.yml

scrape_configs:
  - job_name: meal-plan
    metrics_path: /metrics
    static_configs:
      - targets: ['app:3000']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: containers
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'container_(fs_(limit|usage)_bytes|memory_working_set_bytes|spec_memory_limit_bytes)'
        action: keep
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service
      - regex: 'container_label_.*|id|image|name'
        action: labeldrop
