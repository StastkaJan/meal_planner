global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/capacity-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: meal-plan
    metrics_path: /metrics
    static_configs:
      - targets: ['app:3000']

  - job_name: meal-plan-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://app:3000/health']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: containers
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'container_(fs_(limit|usage)_bytes|memory_working_set_bytes|spec_memory_limit_bytes)'
        action: keep
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service
      - regex: 'container_label_.*|id|image|name'
        action: labeldrop
