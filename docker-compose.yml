services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mealplan
      POSTGRES_USER: mealplan
      POSTGRES_PASSWORD: mealplan
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mealplan']
      interval: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
        SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://mealplan:mealplan@db:5432/mealplan
      ORIGIN: http://localhost:3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_TOKEN: ${METRICS_TOKEN:-development-metrics-token}
      PUBLIC_SENTRY_DSN: ${PUBLIC_SENTRY_DSN:-}
      PUBLIC_SENTRY_ENVIRONMENT: ${PUBLIC_SENTRY_ENVIRONMENT:-development}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health >/dev/null']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s

  prometheus:
    image: prom/prometheus:v3.13.1
    ports:
      - '9090:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-development-metrics-token}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        sed "s/__METRICS_TOKEN__/$${METRICS_TOKEN}/" /etc/prometheus/prometheus.yml > /tmp/prometheus.yml
        exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=7d
    depends_on:
      app:
        condition: service_healthy

  loki:
    image: grafana/loki:3.7.0
    volumes:
      - ./monitoring/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  alloy:
    image: grafana/alloy:v1.18.0
    ports:
      - '12345:12345'
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.4.0
    ports:
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki

volumes:
  pgdata:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
