services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mealplan
      POSTGRES_USER: mealplan
      POSTGRES_PASSWORD: mealplan
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mealplan']
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://mealplan:mealplan@db:5432/mealplan
      ORIGIN: http://localhost:3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEPLOYMENT_VERSION: ${DEPLOYMENT_VERSION:-dev}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edge
      - database
      - monitoring
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health >/dev/null']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s

  backup:
    profiles: ['production']
    build: ./monitoring/backup
    environment:
      DATABASE_URL: postgresql://mealplan:mealplan@db:5432/mealplan
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      RESTORE_DATABASE_URL: postgresql://restorecheck:restorecheck@restore-db:5432/restorecheck
      ALERTMANAGER_URL: http://alertmanager:9093
    depends_on:
      db:
        condition: service_healthy
      restore-db:
        condition: service_healthy
      alertmanager:
        condition: service_started
    networks:
      - edge
      - database
      - monitoring
    restart: unless-stopped

  restore-db:
    profiles: ['production']
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: restorecheck
      POSTGRES_USER: restorecheck
      POSTGRES_PASSWORD: restorecheck
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./monitoring/backup/init-restore-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - database
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U restorecheck']
      interval: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.13.1
    ports:
      - '9090:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/capacity-alerts.yml:/etc/prometheus/capacity-alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    depends_on:
      app:
        condition: service_healthy
      alertmanager:
        condition: service_started
      blackbox-exporter:
        condition: service_started
      node-exporter:
        condition: service_started
      postgres-exporter:
        condition: service_started
      cadvisor:
        condition: service_started
    networks:
      - monitoring

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.19.1
    environment:
      DATA_SOURCE_NAME: postgresql://mealplan:mealplan@db:5432/mealplan?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    networks:
      - database
      - monitoring
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.53.0
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - monitoring
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.0
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    secrets:
      - alert_webhook_url
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    networks:
      - monitoring
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    networks:
      - monitoring
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.12.1
    volumes:
      - /:/host:ro,rslave
    command:
      - --path.rootfs=/host
      - --collector.disable-defaults
      - --collector.filesystem
    networks:
      - monitoring
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.0
    volumes:
      - ./monitoring/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring

  alloy:
    image: grafana/alloy:v1.18.0
    ports:
      - '12345:12345'
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:12.4.0
    ports:
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring

networks:
  edge:
  database:
    internal: true
  monitoring:
    internal: true

volumes:
  pgdata:
  prometheus-data:
  alertmanager-data:
  loki-data:
  alloy-data:
  grafana-data:

secrets:
  alert_webhook_url:
    file: ${ALERT_WEBHOOK_URL_FILE:-./monitoring/alert-webhook-url.example}
